name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # POSIX 打包自检：release 的 linux/darwin 打包分支只在 tag 触发时执行，PR 阶段零覆盖，
  # 这里在 ubuntu 上原生构建并打包一次，把 POSIX 的 zip 分支纳入每次 PR 检查。
  package-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26'
      - run: bun install --frozen-lockfile
      - name: POSIX 构建与打包自检
        run: |
          bun run build:tui --target bun-linux-x64
          bun run build:launcher --target bun-linux-x64
          bun run scripts/repo/package-release.ts --version 0.0.0-test --platform linux-x64
          test -f dist/aizen-assistant-0.0.0-test-linux-x64.zip

  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26'
      - run: bun install --frozen-lockfile
      - name: 校验 bash 安装脚本语法
        shell: bash
        run: bash -n install.sh
      - name: 校验 PowerShell 安装脚本语法
        shell: powershell
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { $_.Message }; exit 1 }
      - name: 准备测试诊断工具
        shell: powershell
        run: ./scripts/ci/setup-test-diagnostics.ps1
      - name: 运行完整验证
        run: bun run verify
        env:
          AIZEN_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/aizen-test-diagnostics
      - name: 上传测试超时诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-timeout-diagnostics
          path: ${{ runner.temp }}/aizen-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
