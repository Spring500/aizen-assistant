name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 生成侧边栏并校验一致性
        run: |
          bun run docs:gen
          git diff --exit-code docs/.vitepress/sidebar.generated.ts
      - name: 构建文档站
        run: bun run docs:build
      # 仓库公开并启用 GitHub Pages 后，在此追加部署步骤（actions/deploy-pages）
